<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা কল অ্যানাউন্সার</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            max-width: 320px;
            width: 100%;
        }
        h3 { color: #2d3436; margin-bottom: 10px; }
        p { color: #636e72; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>ব্যাকগ্রাউন্ড সার্ভিস সচল আছে</h3>
        <p>কল বা মেসেজ আসলে অ্যাপটি স্বয়ংক্রিয়ভাবে আপনাকে জানিয়ে দেবে।</p>
    </div>

    <script src="app.js"></script>
</body>
</html>
